<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standalone Chart.js Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .chart-container {
            border: 2px solid #333;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        canvas {
            max-height: 400px;
            width: 100% !important;
        }
    </style>
</head>
<body>
    <h1>Standalone Chart.js Test</h1>
    <p>This test verifies that Chart.js works independently of DataTables.</p>

    <div id="status" class="status">Testing Chart.js...</div>

    <div class="chart-container">
        <h3>Test Chart 1: Bar Chart</h3>
        <canvas id="barChart"></canvas>
    </div>

    <div class="chart-container">
        <h3>Test Chart 2: Pie Chart</h3>
        <canvas id="pieChart"></canvas>
    </div>

    <button onclick="createTestCharts()">Create Test Charts</button>
    <button onclick="destroyCharts()">Destroy Charts</button>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        let barChartInstance = null;
        let pieChartInstance = null;

        console.log('🎯 Chart.js loaded:', typeof Chart !== 'undefined');
        console.log('📊 Chart.js version:', typeof Chart !== 'undefined' ? Chart.version : 'NOT LOADED');

        function updateStatus(message, isError = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + (isError ? 'error' : 'success');
        }

        function createTestCharts() {
            try {
                console.log('🚀 Creating test charts...');

                // Test data similar to what our plugin would generate
                const officeData = {
                    labels: ['London', 'New York', 'Tokyo', 'Edinburgh'],
                    datasets: [{
                        label: 'Average Salary',
                        data: [55000, 77500, 65000, 85000],
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.8)',
                            'rgba(54, 162, 235, 0.8)',
                            'rgba(255, 205, 86, 0.8)',
                            'rgba(75, 192, 192, 0.8)'
                        ],
                        borderColor: [
                            'rgba(255, 99, 132, 1)',
                            'rgba(54, 162, 235, 1)',
                            'rgba(255, 205, 86, 1)',
                            'rgba(75, 192, 192, 1)'
                        ],
                        borderWidth: 1
                    }]
                };

                const countData = {
                    labels: ['London', 'New York', 'Tokyo', 'Edinburgh'],
                    datasets: [{
                        label: 'Employee Count',
                        data: [8, 5, 6, 4],
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.8)',
                            'rgba(54, 162, 235, 0.8)',
                            'rgba(255, 205, 86, 0.8)',
                            'rgba(75, 192, 192, 0.8)'
                        ]
                    }]
                };

                // Destroy existing charts if they exist
                if (barChartInstance) {
                    barChartInstance.destroy();
                }
                if (pieChartInstance) {
                    pieChartInstance.destroy();
                }

                // Create Bar Chart
                const barCtx = document.getElementById('barChart').getContext('2d');
                barChartInstance = new Chart(barCtx, {
                    type: 'bar',
                    data: officeData,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: {
                                display: true,
                                text: 'Average Salary by Office'
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: function(value) {
                                        return '$' + value.toLocaleString();
                                    }
                                }
                            }
                        }
                    }
                });

                console.log('📊 Bar chart created:', barChartInstance);

                // Create Pie Chart
                const pieCtx = document.getElementById('pieChart').getContext('2d');
                pieChartInstance = new Chart(pieCtx, {
                    type: 'pie',
                    data: countData,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: {
                                display: true,
                                text: 'Employee Count by Office'
                            },
                            legend: {
                                display: true,
                                position: 'bottom'
                            }
                        }
                    }
                });

                console.log('🥧 Pie chart created:', pieChartInstance);

                updateStatus('✅ Charts created successfully!');

            } catch (error) {
                console.error('❌ Error creating charts:', error);
                updateStatus('❌ Error creating charts: ' + error.message, true);
            }
        }

        function destroyCharts() {
            try {
                if (barChartInstance) {
                    barChartInstance.destroy();
                    barChartInstance = null;
                    console.log('🗑️ Bar chart destroyed');
                }
                if (pieChartInstance) {
                    pieChartInstance.destroy();
                    pieChartInstance = null;
                    console.log('🗑️ Pie chart destroyed');
                }
                updateStatus('🗑️ Charts destroyed');
            } catch (error) {
                console.error('❌ Error destroying charts:', error);
                updateStatus('❌ Error destroying charts: ' + error.message, true);
            }
        }

        // Auto-create charts on load
        window.addEventListener('load', function() {
            if (typeof Chart === 'undefined') {
                updateStatus('❌ Chart.js not loaded!', true);
                return;
            }

            setTimeout(createTestCharts, 500);
        });

        // Global error handler
        window.addEventListener('error', function(e) {
            console.error('🚨 Global Error:', e.message);
            updateStatus('🚨 JavaScript Error: ' + e.message, true);
        });
    </script>
</body>
</html>
