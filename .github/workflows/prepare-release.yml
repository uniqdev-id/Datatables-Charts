name: Prepare Release

on:
    workflow_dispatch:
        inputs:
            version_type:
                description: 'Version bump type'
                required: true
                default: 'patch'
                type: choice
                options:
                    - patch
                    - minor
                    - major
            custom_version:
                description: 'Custom version (overrides version_type)'
                required: false
                type: string

jobs:
    prepare-release:
        runs-on: ubuntu-latest

        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Configure Git
              run: |
                  git config user.name "GitHub Actions"
                  git config user.email "actions@github.com"

            - name: Determine new version
              id: version
              run: |
                  CURRENT_VERSION=$(node -p "require('./package.json').version")

                  if [ -n "${{ github.event.inputs.custom_version }}" ]; then
                    NEW_VERSION="${{ github.event.inputs.custom_version }}"
                    # Remove 'v' prefix if present
                    NEW_VERSION=${NEW_VERSION#v}
                  else
                    # Use npm version to calculate new version
                    NEW_VERSION=$(npm version ${{ github.event.inputs.version_type }} --no-git-tag-version | sed 's/v//')
                  fi

                  echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_OUTPUT
                  echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
                  echo "TAG_VERSION=v$NEW_VERSION" >> $GITHUB_OUTPUT

                  echo "Version bump: $CURRENT_VERSION → $NEW_VERSION"

            - name: Run tests and linting
              run: |
                  npm run lint
                  npm run build

            - name: Update version in files
              run: |
                  NEW_VERSION=${{ steps.version.outputs.NEW_VERSION }}

                  # Update package.json
                  npm version $NEW_VERSION --no-git-tag-version

                  # Update version in source files if they contain version info
                  # if grep -q "version.*:" src/datatables.charts.js; then
                  #   sed -i "s/version.*:.*/version: '$NEW_VERSION',/" src/datatables.charts.js
                  # fi

            - name: Build with new version
              run: npm run build

            - name: Generate release notes
              id: release_notes
              run: |
                  TAG_VERSION=${{ steps.version.outputs.TAG_VERSION }}
                  CURRENT_VERSION=${{ steps.version.outputs.CURRENT_VERSION }}

                  # Get commits since last version tag
                  LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

                  if [ -n "$LAST_TAG" ]; then
                    COMMITS=$(git log --pretty=format:"- %s (%h)" $LAST_TAG..HEAD)
                  else
                    COMMITS=$(git log --pretty=format:"- %s (%h)" --max-count=10)
                  fi

                  # Create release notes
                  cat > RELEASE_NOTES.md << EOF
                  # Release Notes for $TAG_VERSION

                  ## Changes since v$CURRENT_VERSION

                  $COMMITS

                  ## What's Included

                  ### Core Files
                  - \`src/datatables.charts.js\` - Main plugin source
                  - \`src/datatables.charts.css\` - Styling with UI polish improvements
                  - \`dist/datatables.charts.min.js\` - Minified production build

                  ### Examples & Documentation
                  - \`examples/\` - Usage examples and demos
                  - \`README.md\` - Installation and usage instructions
                  - \`UI-POLISH-SUMMARY.md\` - UI improvements documentation

                  ## Installation

                  ### Via Direct Download
                  1. Download the release files
                  2. Include in your HTML:
                  \`\`\`html
                  <link rel="stylesheet" href="path/to/datatables.charts.css">
                  <script src="path/to/datatables.charts.min.js"></script>
                  \`\`\`

                  ### Usage
                  \`\`\`javascript
                  \$('#myTable').DataTable({
                      // DataTable options
                  }).charts({
                      type: 'bar',
                      columns: [0, 1, 2]
                  });
                  \`\`\`

                  ## Browser Support
                  - Modern browsers (Chrome, Firefox, Safari, Edge)
                  - IE11+ (with polyfills)

                  ## Dependencies
                  - jQuery 3.x
                  - DataTables 1.10+
                  - Chart.js 3.x

                  ---

                  For detailed examples and documentation, see the [examples](examples/) directory.
                  EOF

                  echo "RELEASE_NOTES_CONTENT<<EOF" >> $GITHUB_OUTPUT
                  cat RELEASE_NOTES.md >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Create release branch
              run: |
                  BRANCH_NAME="release/${{ steps.version.outputs.TAG_VERSION }}"
                  git checkout -b $BRANCH_NAME
                  git add .
                  git commit -m "Prepare release ${{ steps.version.outputs.TAG_VERSION }}"
                  git push origin $BRANCH_NAME
                  echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

            - name: Create Pull Request
              uses: peter-evans/create-pull-request@v5
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  branch: release/${{ steps.version.outputs.TAG_VERSION }}
                  title: 'Release ${{ steps.version.outputs.TAG_VERSION }}'
                  body: |
                      ## Release Preparation for ${{ steps.version.outputs.TAG_VERSION }}

                      This PR prepares the release for version ${{ steps.version.outputs.TAG_VERSION }}.

                      ### Changes
                      - ✅ Version bumped from v${{ steps.version.outputs.CURRENT_VERSION }} to ${{ steps.version.outputs.TAG_VERSION }}
                      - ✅ Built minified files updated
                      - ✅ Tests and linting passed

                      ### Release Notes Preview
                      ${{ steps.release_notes.outputs.RELEASE_NOTES_CONTENT }}

                      ### Next Steps
                      1. Review and merge this PR
                      2. Create a git tag: `git tag ${{ steps.version.outputs.TAG_VERSION }}`
                      3. Push the tag: `git push origin ${{ steps.version.outputs.TAG_VERSION }}`
                      4. The release workflow will automatically create the GitHub release

                      Or use the manual release workflow with version `${{ steps.version.outputs.TAG_VERSION }}`.
                  labels: |
                      release
                      automated

            - name: Summary
              run: |
                  echo "## Release Preparation Summary" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Version bumped: v${{ steps.version.outputs.CURRENT_VERSION }} → ${{ steps.version.outputs.TAG_VERSION }}" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Built and tested successfully" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Release branch created: release/${{ steps.version.outputs.TAG_VERSION }}" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Pull request created for review" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
                  echo "1. Review and merge the pull request" >> $GITHUB_STEP_SUMMARY
                  echo "2. Create and push the git tag" >> $GITHUB_STEP_SUMMARY
                  echo "3. Release workflow will automatically run" >> $GITHUB_STEP_SUMMARY
