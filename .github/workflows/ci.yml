name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Verify build outputs
        run: |
          echo "Checking if build outputs exist..."
          test -f dist/datatables.charts.min.js || (echo "Missing minified JS file" && exit 1)
          echo "✅ Build outputs verified"

      - name: Check file sizes
        run: |
          echo "File sizes:"
          ls -lh src/
          ls -lh dist/
          echo "✅ File size check complete"

  compatibility:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Validate JavaScript syntax
        run: |
          echo "Validating JavaScript files..."
          node -c src/datatables.charts.js
          node -c dist/datatables.charts.min.js
          echo "✅ JavaScript syntax validation passed"

      - name: Check CSS syntax
        run: |
          echo "Basic CSS validation..."
          # Basic check for CSS syntax issues
          if grep -E "(^|\s)[{}]" src/datatables.charts.css; then
            echo "❌ Potential CSS syntax issues found"
            exit 1
          fi
          echo "✅ CSS syntax check passed"

  code-quality:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: |
          echo "Checking code formatting with Prettier..."
          npx prettier --check "src/**/*.{js,css}" "examples/**/*.{html,js,css}" || true
          echo "✅ Code formatting check complete"

      - name: Analyze bundle size
        run: |
          npm run build
          echo "Bundle size analysis:"
          echo "Original JS: $(wc -c < src/datatables.charts.js) bytes"
          echo "Minified JS: $(wc -c < dist/datatables.charts.min.js) bytes"
          echo "CSS: $(wc -c < src/datatables.charts.css) bytes"

          # Calculate compression ratio
          ORIGINAL_SIZE=$(wc -c < src/datatables.charts.js)
          MINIFIED_SIZE=$(wc -c < dist/datatables.charts.min.js)
          RATIO=$(echo "scale=2; $MINIFIED_SIZE * 100 / $ORIGINAL_SIZE" | bc -l)
          echo "Compression ratio: ${RATIO}%"

  security:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: |
          npm audit --audit-level high || true
          echo "✅ Security audit complete"

      - name: Check for sensitive data
        run: |
          echo "Checking for potential sensitive data..."
          # Check for common sensitive patterns
          if grep -r -i -E "(api[_-]?key|password|secret|token)" src/ examples/ --exclude-dir=node_modules || true; then
            echo "⚠️ Potential sensitive data found - please review"
          fi
          echo "✅ Sensitive data check complete"
