name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [16.x, 18.x, 20.x]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: npm ci

            - name: Run linting
              run: npm run lint

            - name: Build project
              run: npm run build

            - name: Verify build outputs
              run: |
                  echo "Checking if build outputs exist..."
                  test -f dist/datatables.charts.min.js || (echo "Missing minified JS file" && exit 1)
                  test -f dist/datatables.charts.js || (echo "Missing JS file" && exit 1)
                  echo "✅ Build outputs verified"

            - name: Check file sizes
              run: |
                  echo "File sizes:"
                  ls -lh src/
                  ls -lh dist/
                  echo "✅ File size check complete"

            - name: Test NPM pack
              run: |
                  echo "Testing NPM package creation..."
                  npm pack --dry-run
                  echo "✅ NPM pack test passed"

    compatibility:
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build project
              run: npm run build

            - name: Validate JavaScript syntax
              run: |
                  echo "Validating JavaScript files..."
                  node -c dist/datatables.charts.js
                  node -c dist/datatables.charts.min.js
                  echo "✅ JavaScript syntax validation passed"

            - name: Check CSS syntax
              run: |
                  echo "Basic CSS validation..."
                  # Basic check for CSS syntax issues
                  if grep -E "(^|\s)[{}]" src/datatables.charts.css; then
                    echo "❌ Potential CSS syntax issues found"
                    exit 1
                  fi
                  echo "✅ CSS syntax check passed"

            - name: Test package structure
              run: |
                  echo "Validating package.json structure..."
                  node -e "
                    const pkg = require('./package.json');
                    const required = ['name', 'version', 'description', 'main', 'files', 'keywords', 'author', 'license', 'repository'];
                    const missing = required.filter(field => !pkg[field]);
                    if (missing.length > 0) {
                      console.error('Missing required fields:', missing);
                      process.exit(1);
                    }
                    console.log('✅ Package.json structure is valid');
                  "

    code-quality:
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Check code formatting
              run: |
                  echo "Checking code formatting with Prettier..."
                  npx prettier --check "src/**/*.{js,css}" "examples/**/*.{html,js,css}" || true
                  echo "✅ Code formatting check complete"

            - name: Analyze bundle size
              run: |
                  npm run build
                  echo "Bundle size analysis:"
                  echo "Original JS: $(wc -c < dist/datatables.charts.js) bytes"
                  echo "Minified JS: $(wc -c < dist/datatables.charts.min.js) bytes"
                  echo "CSS: $(wc -c < src/datatables.charts.css) bytes"

                  # Calculate compression ratio
                  ORIGINAL_SIZE=$(wc -c < dist/datatables.charts.js)
                  MINIFIED_SIZE=$(wc -c < dist/datatables.charts.min.js)
                  if [ $ORIGINAL_SIZE -gt 0 ]; then
                    RATIO=$(awk "BEGIN {printf \"%.2f\", $MINIFIED_SIZE * 100 / $ORIGINAL_SIZE}")
                    echo "Compression ratio: ${RATIO}%"
                  fi

            - name: Check for TODO/FIXME comments
              run: |
                  echo "Checking for TODO/FIXME comments..."
                  TODOS=$(grep -r -n -E "(TODO|FIXME|XXX)" src/ dist/ --exclude-dir=node_modules || true)
                  if [ -n "$TODOS" ]; then
                    echo "Found pending items:"
                    echo "$TODOS"
                  else
                    echo "No pending TODO/FIXME items found"
                  fi
                  echo "✅ Code review check complete"

    security:
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run security audit
              run: |
                  npm audit --audit-level high || true
                  echo "✅ Security audit complete"

            - name: Check for sensitive data
              run: |
                  echo "Checking for potential sensitive data..."
                  # Check for common sensitive patterns
                  if grep -r -i -E "(api[_-]?key|password|secret|token)" src/ examples/ --exclude-dir=node_modules || true; then
                    echo "⚠️ Potential sensitive data found - please review"
                  fi
                  echo "✅ Sensitive data check complete"

    npm-publish-test:
        runs-on: ubuntu-latest
        needs: [test, compatibility, code-quality]
        if: github.event_name == 'pull_request'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: npm ci

            - name: Build project
              run: npm run build

            - name: Test NPM publish (dry run)
              run: |
                  echo "Testing NPM publish process..."
                  npm publish --dry-run
                  echo "✅ NPM publish dry run successful"

            - name: Verify package contents
              run: |
                  echo "Verifying package contents..."
                  npm pack
                  TAR_FILE=$(ls *.tgz)
                  echo "Created package: $TAR_FILE"

                  # Extract and verify contents
                  tar -tzf $TAR_FILE | head -20
                  echo "✅ Package contents verified"

            - name: Check package size
              run: |
                  echo "Checking package size..."
                  TAR_FILE=$(ls *.tgz)
                  SIZE=$(stat -c%s "$TAR_FILE" 2>/dev/null || stat -f%z "$TAR_FILE")
                  SIZE_KB=$((SIZE / 1024))
                  echo "Package size: ${SIZE_KB}KB"

                  if [ $SIZE_KB -gt 1000 ]; then
                    echo "⚠️ Package size is quite large (${SIZE_KB}KB)"
                  else
                    echo "✅ Package size looks good (${SIZE_KB}KB)"
                  fi
