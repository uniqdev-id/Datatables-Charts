name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Release version (e.g., v1.0.0)'
                required: true
                type: string

jobs:
    build-and-release:
        runs-on: ubuntu-latest

        permissions:
            contents: write
            packages: write
            id-token: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: npm ci

            - name: Run linting
              run: npm run lint

            - name: Build minified version
              run: npm run build

            - name: Verify build outputs
              run: |
                  echo "Checking build outputs..."
                  ls -la dist/
                  echo "Source files:"
                  ls -la src/

            - name: Get version from tag or input
              id: version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    VERSION="${{ github.event.inputs.version }}"
                  else
                    VERSION=${GITHUB_REF#refs/tags/}
                  fi
                  echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
                  echo "Release version: $VERSION"

            - name: Update package.json version
              run: |
                  VERSION=${{ steps.version.outputs.VERSION }}
                  # Remove 'v' prefix if present
                  VERSION_NUMBER=${VERSION#v}
                  npm version $VERSION_NUMBER --no-git-tag-version --allow-same-version

            - name: Publish to NPM
              run: |
                  echo "Publishing to NPM..."
                  npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Create release archive
              run: |
                  mkdir -p release-assets

                  # Create source archive
                  zip -r release-assets/datatables-chart-src.zip src/ examples/ README.md package.json

                  # Create distribution archive with minified files
                  zip -r release-assets/datatables-chart-dist.zip dist/ src/datatables.charts.css README.md

                  # Create complete package
                  zip -r release-assets/datatables-chart-complete.zip . -x "node_modules/*" ".git/*" "release-assets/*"

            - name: Generate changelog
              id: changelog
              run: |
                  VERSION=${{ steps.version.outputs.VERSION }}

                  # Get commits since last tag
                  PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

                  if [ -n "$PREVIOUS_TAG" ]; then
                    COMMITS=$(git log --pretty=format:"- %s" $PREVIOUS_TAG..HEAD)
                  else
                    COMMITS=$(git log --pretty=format:"- %s")
                  fi

                  # Create changelog
                  cat > CHANGELOG.md << EOF
                  ## What's Changed in $VERSION

                  ### Features & Improvements
                  $COMMITS

                  ### Installation

                  #### Via NPM
                  \`\`\`bash
                  npm install datatables-chart
                  \`\`\`

                  #### Via CDN
                  \`\`\`html
                  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/datatables-chart@${{ steps.version.outputs.VERSION }}/src/datatables.charts.css">
                  <script src="https://cdn.jsdelivr.net/npm/datatables-chart@${{ steps.version.outputs.VERSION }}/dist/datatables.charts.min.js"></script>
                  \`\`\`

                  #### Manual Download
                  - **datatables-chart-dist.zip**: Minified production files ready to use
                  - **datatables-chart-src.zip**: Source files and examples for development
                  - **datatables-chart-complete.zip**: Complete package with all files

                  ### Usage
                  \`\`\`html
                  <link rel="stylesheet" href="path/to/datatables.charts.css">
                  <script src="path/to/datatables.charts.min.js"></script>
                  \`\`\`

                  \`\`\`javascript
                  \$('#myTable').DataTable({
                      // DataTable options
                  }).charts({
                      type: 'bar',
                      columns: [0, 1, 2]
                  });
                  \`\`\`

                  ### Quick Start
                  See the examples folder for usage demonstrations.
                  EOF

                  echo "CHANGELOG_CONTENT<<EOF" >> $GITHUB_OUTPUT
                  cat CHANGELOG.md >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.version.outputs.VERSION }}
                  name: DataTables Charts Plugin ${{ steps.version.outputs.VERSION }}
                  body: ${{ steps.changelog.outputs.CHANGELOG_CONTENT }}
                  files: |
                      release-assets/datatables-chart-dist.zip
                      release-assets/datatables-chart-src.zip
                      release-assets/datatables-chart-complete.zip
                      dist/datatables.charts.min.js
                      src/datatables.charts.css
                      src/datatables.charts.js
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Post-release summary
              run: |
                  echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Successfully created release ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Published to NPM registry" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Package Available:" >> $GITHUB_STEP_SUMMARY
                  echo "- 📦 NPM: \`npm install datatables-chart@${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
                  echo "- 🌐 CDN: \`https://cdn.jsdelivr.net/npm/datatables-chart@${{ steps.version.outputs.VERSION }}/\`" >> $GITHUB_STEP_SUMMARY
                  echo "- 📥 GitHub Releases: Manual download archives" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Released Assets:" >> $GITHUB_STEP_SUMMARY
                  echo "- datatables-chart-dist.zip (Production files)" >> $GITHUB_STEP_SUMMARY
                  echo "- datatables-chart-src.zip (Source + examples)" >> $GITHUB_STEP_SUMMARY
                  echo "- datatables-chart-complete.zip (Full package)" >> $GITHUB_STEP_SUMMARY
                  echo "- Individual JS/CSS files" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
                  echo "- Package is now available on NPM" >> $GITHUB_STEP_SUMMARY
                  echo "- Release is available on GitHub" >> $GITHUB_STEP_SUMMARY
                  echo "- CDN links are active via jsDelivr" >> $GITHUB_STEP_SUMMARY
                  echo "- Update documentation with new installation methods" >> $GITHUB_STEP_SUMMARY
